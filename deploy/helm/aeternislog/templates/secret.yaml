{{- if not .Values.fabric.identity.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aeternislog.identitySecret" . }}
  labels:
    {{- include "aeternislog.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Peer TLS CA, client signing certificate, and the SENSITIVE signing key. For
  # production prefer fabric.identity.existingSecret managed by an external secret
  # store (Vault, External Secrets, PKCS#11/HSM) — see docs/runbook-operacao-prod.md.
  tls-ca.pem: |
{{ .Values.fabric.identity.tlsCaCert | default "" | indent 4 }}
  sign-cert.pem: |
{{ .Values.fabric.identity.signCert | default "" | indent 4 }}
  sign-key.pem: |
{{ .Values.fabric.identity.signKey | default "" | indent 4 }}
{{- end }}
