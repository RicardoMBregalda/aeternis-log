{{- if or .Values.auth.apiKeys .Values.auth.tenants .Values.webhook.secret }}
# Sensitive runtime configuration — API keys and the webhook signing secret.
# These are injected into the API as environment variables (which override the
# config.yaml ConfigMap) so that credentials never live in a ConfigMap.
# For production prefer an external secret store (Vault, External Secrets, CSI).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aeternislog.appSecret" . }}
  labels:
    {{- include "aeternislog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.apiKeys }}
  AUTH_API_KEYS: {{ join "," .Values.auth.apiKeys | quote }}
  {{- end }}
  {{- if .Values.auth.tenants }}
  AUTH_TENANTS: {{ include "aeternislog.tenantsEnv" . | quote }}
  {{- end }}
  {{- if .Values.webhook.secret }}
  WEBHOOK_SECRET: {{ .Values.webhook.secret | quote }}
  {{- end }}
{{- end }}
