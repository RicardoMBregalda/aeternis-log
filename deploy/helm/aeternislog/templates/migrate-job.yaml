{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aeternislog.fullname" . }}-migrate
  labels:
    {{- include "aeternislog.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Apply pending schema migrations BEFORE the API rolls out, on both install
    # and upgrade. Schema changes are a deploy step, never an API boot side
    # effect: the API only asserts the version and refuses to start on a
    # mismatch (F18). hook-weight -5 sequences this ahead of the workload.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "aeternislog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.api.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.api.securityContext.runAsUser }}
        runAsGroup: {{ .Values.api.securityContext.runAsGroup }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/aeternislog-migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Same config + secret as the API, so the migrator reaches the same
          # MongoDB. It does not touch Fabric or the WAL.
          envFrom:
            - secretRef:
                name: {{ include "aeternislog.appSecret" . }}
                optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aeternislog.fullname" . }}-config
{{- end }}
