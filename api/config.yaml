# Configuration file for AeternisLog API (Go version)

server:
  host: "0.0.0.0"
  port: 5001
  debug: false
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s
  max_body_bytes: 1048576          # 1 MiB request body cap (0 disables)
  cors_allowed_origins: ["*"]      # "*" = any origin without credentials; list explicit origins to enable credentialed CORS

mongodb:
  url: "mongodb://localhost:27017"
  database: "logdb"
  collection: "logs"
  records_collection: "records"
  sync_control_collection: "sync_control"
  min_pool_size: 10
  max_pool_size: 100
  max_idle_time_ms: 300000
  server_selection_timeout_ms: 5000
  connect_timeout: 10s
  socket_timeout: 30s

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 50
  min_idle_conns: 10
  max_retries: 3
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  cache_ttl: 600  # 10 minutes
  cache_enabled: true

fabric:
  api_url: "http://localhost:4000"
  channel: "logchannel"
  chaincode: "logchaincode"
  sync_enabled: true
  invoke_timeout: 30s
  query_timeout: 10s
  # Only the "gateway" (Fabric Gateway gRPC SDK) transport is supported.
  transport: "gateway"
  # Gateway (gRPC) transport settings. Paths point at the crypto-config mounted
  # by docker-compose at /fabric-crypto. For a native run, override these and
  # gateway_peer_endpoint.
  msp_id: "Org1MSP"
  gateway_peer_endpoint: "peer0.org1.example.com:7051"
  gateway_server_name_override: "peer0.org1.example.com"
  gateway_peer_tls_ca_file: "/fabric-crypto/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt"
  identity_cert_file: "/fabric-crypto/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem"
  identity_key_dir: "/fabric-crypto/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore"
  # Per-tenant channels (ledger-level isolation): map a tenant to its own Fabric
  # channel. Unmapped tenants anchor to `channel` above. The channel must already
  # exist with the chaincode committed (see prod/scripts/create-tenant-channel.sh).
  # Env override: FABRIC_TENANT_CHANNELS="acme:acme-channel,globex:globex-channel".
  # tenant_channels:
  #   acme: "acme-channel"
  # Per-tenant signing identities (ledger-level isolation by identity): each
  # tenant anchors with a cert carrying its `tenant` attribute, which the
  # chaincode uses to partition batch state (F14). Unmapped tenants use the
  # default identity above. Provision with prod/scripts/register-tenant-identity.sh.
  # tenant_identities:
  #   acme:
  #     msp_id: "Org1MSP"            # optional; defaults to msp_id above
  #     identity_cert_file: "/fabric-identity/tenants/acme/signcerts/cert.pem"
  #     identity_key_dir: "/fabric-identity/tenants/acme/keystore"

# Durable, append-only file WAL fronting the record-create path.
wal:
  enabled: true
  directory: "/var/log/aeternislog-wal"

batching:
  enabled: true
  auto_batch_size: 100
  auto_batch_interval: 30s
  batch_executor_workers: 5
  verification_enabled: true

logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json or console
  output: "stdout"  # stdout or file path
  enable_caller: true

metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# API key authentication for protected routes (logs, merkle, wal, stats).
# Disabled by default; enable in production and configure at least one key.
# Clients send the key in `header_name` or as "Authorization: Bearer <key>".
auth:
  enabled: false
  header_name: "X-API-Key"
  api_keys: []
  # api_keys (flat keys belong to tenant "default"):
  #   - "replace-with-a-strong-random-key"
  # Multi-tenancy: keys under a tenant resolve to that tenant; records are
  # isolated per (tenant, domain).
  # tenants:
  #   - id: "acme"
  #     keys: ["acme-key-1"]
  #   - id: "globex"
  #     keys: ["globex-key-1"]

# Per-client-IP rate limiting (in-memory, per instance).
rate_limit:
  enabled: false
  max_requests: 100
  window: 1m

# Webhook fired when a batch is anchored on the blockchain. When `secret` is set,
# the JSON body is signed with HMAC-SHA256 (header X-Webhook-Signature).
webhook:
  enabled: false
  url: ""
  secret: ""
  timeout: 5s
  max_retries: 3
