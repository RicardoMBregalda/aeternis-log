services:
  go-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeternislog-api
    hostname: go-api
    ports:
      - "5001:5001"  # API port
      - "9090:9090"  # Metrics port
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - wal-data:/var/log/aeternislog-wal
      # crypto material for the gateway (gRPC) transport, mounted read-only.
      - ../hybrid-architecture/fabric-network/crypto-config:/fabric-crypto:ro
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5001
      - MONGO_URL=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FABRIC_API_URL=http://fabric-api:4000
      - WAL_DIRECTORY=/var/log/aeternislog-wal
      - LOG_LEVEL=info
      # Dev convenience: apply DB migrations before the API starts. In Kubernetes
      # this is a separate pre-upgrade Job and this stays unset (API asserts only).
      - RUN_MIGRATIONS=true
      # Fabric uses the gateway (gRPC) transport with the crypto mounted at
      # /fabric-crypto and the paths in config.yaml.
    depends_on:
      - mongodb
      - redis
    networks:
      - aeternislog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:7.0
    container_name: aeternislog-mongodb
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=logdb
    networks:
      - aeternislog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aeternislog-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # AOF with appendfsync=always gives per-write durability, matching the file
    # WAL's fsync guarantee when wal.backend is "redis" (zero data loss).
    command: redis-server --appendonly yes --appendfsync always
    networks:
      - aeternislog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Static integrity dashboard (examples/dashboard), served by nginx. It is a
  # dependency-free single-page app with no build step, so nginx just serves the
  # files from a read-only bind mount. The browser talks to the API directly at
  # the published host port (default http://localhost:5001), not through nginx,
  # so no reverse-proxy config is needed. See examples/dashboard/README.md.
  dashboard:
    image: nginx:1.27-alpine
    container_name: aeternislog-dashboard
    hostname: dashboard
    ports:
      - "8088:80"
    volumes:
      - ../examples/dashboard:/usr/share/nginx/html:ro
    networks:
      - aeternislog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  wal-data:
    driver: local

networks:
  aeternislog-network:
    external: true
    name: aeternislog_network
