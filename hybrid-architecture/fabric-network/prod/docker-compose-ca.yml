# Fabric CA per organization (production-staging on a single host).
# One CA per peer org (Org1/Org2/Org3) plus one for the orderer org.
# Identities are provisioned with fabric-ca-client (register/enroll) — no cryptogen.
# Isolated from the dev stack: own network (tcc_log_network_prod) and host ports.

networks:
  prod-net:
    name: tcc_log_network_prod
    external: true

services:
  ca.org1.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.org1.prod
    mem_limit: 256m
    cpus: 0.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7154:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/fabric-ca/org1:/etc/hyperledger/fabric-ca-server
    networks:
      - prod-net

  ca.org2.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.org2.prod
    mem_limit: 256m
    cpus: 0.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7254:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/fabric-ca/org2:/etc/hyperledger/fabric-ca-server
    networks:
      - prod-net

  ca.org3.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.org3.prod
    mem_limit: 256m
    cpus: 0.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org3
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7354:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/fabric-ca/org3:/etc/hyperledger/fabric-ca-server
    networks:
      - prod-net

  ca.orderer.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.orderer.prod
    mem_limit: 256m
    cpus: 0.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7454:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    networks:
      - prod-net
